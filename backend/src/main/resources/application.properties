spring.application.name=Worklink1

# Datasource configuration: defaults to resilient in-memory H2 with MySQL compatibility, or connects to external MySQL if URL provided
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:worklink_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Auto create and update database tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true

# Server port configured for local dev and cloud containers (Render assigns PORT env)
server.port=${PORT:8080}

# Actuator health endpoint for Render health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always